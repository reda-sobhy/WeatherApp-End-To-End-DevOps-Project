services:
  ui:
    image: redasobhy/weather-ui
    container_name: weatherapp-ui
    ports:
      - "3000:3000"
    environment:
      AUTH_HOST: weather-auth
      AUTH_PORT: 8080
      WEATHER_HOST: weather-weather
      WEATHER_PORT: 5000
    depends_on:
      - auth
      - weather
    networks:
      - weather-network

  auth:
    image: redasobhy/weather-auth
    container_name: weather-auth
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - mysql
    networks:
      - weather-network

  weather:
    image: redasobhy/weather-api
    container_name: weather-weather
    ports:
      - "5000:5000"
    environment:
      WEATHER_API_KEY: ${WEATHER_API_KEY}
    depends_on:
      - auth
    networks:
      - weather-network

  mysql:
    image: mysql:8.0
    container_name: weatherapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - weather-network

volumes:
  mysql-data:

networks:
  weather-network:
    driver: bridge
