apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherapp-ui
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: weatherapp-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weatherapp-ui
    spec:
      containers:
        - name: weatherapp-ui
          image: "afakharany/weatherapp-ui:lab"
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: weatherapp-ui-config

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: http

          readinessProbe:
            httpGet:
              path: /health
              port: http
