apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-auth
  namespace: backend


spec:

  replicas: 2


  selector:

    matchLabels:

      app.kubernetes.io/name: app-auth



  template:

    metadata:

      labels:

        app.kubernetes.io/name: app-auth



    spec:

      serviceAccountName: weather-app-sa


      containers:

      - name: app-auth


        image: afakharany/weatherapp-auth:lab


        imagePullPolicy: IfNotPresent


        ports:

        - containerPort: 8080



        env:


        - name: DB_HOST

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: host



        - name: DB_USER

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: username



        - name: DB_PASSWORD

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: password



        - name: DB_NAME

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: database

