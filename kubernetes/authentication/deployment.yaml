apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-auth
  namespace: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: app-auth

  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-auth

    spec:
      containers:

      - name: app-auth

        image: afakharany/weatherapp-auth:lab

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080


        envFrom:
        - secretRef:
            name: rds-secret
