apiVersion: batch/v1
kind: Job

metadata:
  name: rds-init-job
  namespace: backend


spec:

  backoffLimit: 5


  template:

    spec:

      restartPolicy: Never


      containers:

      - name: mysql-client

        image: mysql:8.0


        env:


        - name: DB_HOST

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: host



        - name: DB_USER

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: username



        - name: DB_PASSWORD

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: password



        - name: DB_NAME

          valueFrom:

            secretKeyRef:

              name: weather-db-v2

              key: database



        command:

        - /bin/sh

        - -c


        args:

        - |

          echo "Connecting to RDS..."


          mysql \
          -h ${DB_HOST} \
          -u ${DB_USER} \
          -p${DB_PASSWORD} <<EOF


          CREATE DATABASE IF NOT EXISTS ${DB_NAME};


          USE ${DB_NAME};


          CREATE TABLE IF NOT EXISTS users (

              id INT AUTO_INCREMENT PRIMARY KEY,

              user_name VARCHAR(100) NOT NULL,

              user_password VARCHAR(255) NOT NULL

          );


          EOF
